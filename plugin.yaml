name: coursewright
version: 0.6.0
manifest_version: 2
requires_hermes: ">=0.23"   # ctx.inject_message, ctx.state, manifest v2
license: MIT
description: >-
  Generates a self-contained, interactive HTML course on any subject at three
  levels of depth (novice, intermediate, advanced) with an in-place level
  toggle, worked visuals, exercises, curated videos and reading, and a
  provenance footer that says what was actually researched. Needs network
  access: the course is written by the host model, and sources are read from
  the web.
author: Nehuen
tags: [learning, study, courses, html, education]
provides_tools:
  - coursewright_plan
  - coursewright_build
  - coursewright_list
  - coursewright_status
provides_hooks: []
requires_env: []
# Optional at runtime, installed when the plugin is: the scraper client, video
# search, transcript badges and thumbnails. Every one of them degrades to
# "feature off, and the course says so" rather than a crash.
python_dependencies:
  # floors are the oldest release with the API we use, bounds keep a major bump from
  # changing behaviour underneath a user (the catalog dependency policy asks for both)
  - "httpx>=0.27,<1"
  - "Pillow>=10,<14"
  - "yt-dlp>=2024.12,<2027"
  - "youtube-transcript-api>=1.0,<2"
config_schema:
  default_level:
    type: str
    choices: [novice, intermediate, advanced]
    default: intermediate
    label: Default level
    description: Which depth the course opens at.
  courses_dir:
    type: str
    default: "~/Courses"
    label: Visible course folder
    description: A copy of every built course is written here. Empty disables the copy.
  enable_videos:
    type: bool
    default: true
    label: Include video resources
  enable_research:
    type: bool
    default: true
    label: Research the topic
    description: Search and read real sources before writing, and list what was used.
  draft_concurrency:
    type: int
    default: 3
    label: Sections drafted at once
    description: >-
      How many sections the build writes in parallel, 1 to 4. Sections are independent, so
      three at once turns an eight-section course from about twenty-five minutes into about
      ten. Set it to 1 for one call at a time.
  max_videos:
    type: int
    default: 6
    label: Maximum videos per course
  max_sources:
    type: int
    default: 12
    label: Maximum sources read per course
  firecrawl_url:
    type: str
    default: ""
    label: Scraper URL (Firecrawl)
    description: >-
      Opt-in Firecrawl instance used as a second reader when the host's own extractor returns
      nothing. Empty disables it; a full URL points at a self-hosted instance (including a
      local stack such as http://localhost:3002) or https://api.firecrawl.dev with the key
      below. The scraper is never probed implicitly.
  firecrawl_key:
    type: secret
    default: ""
    env: FIRECRAWL_API_KEY
    label: Scraper API key
    description: Sent as a Bearer token to the scraper above, read through Hermes' secret store.
  research_timeout:
    type: int
    default: 150
    label: Research seconds
    description: Time budget for searching and reading before the course is written anyway.
