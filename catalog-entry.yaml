name: coursewright
repo: https://github.com/NehuenD/hermes_coursewright
sha: 54968a77b27655ff2bf6ab5744972b57cb67511a
title: Coursewright
description: >-
  Turns a topic into one self-contained HTML course at three depths, novice, intermediate and
  advanced, switched in place without a reload. It researches before it writes: it searches
  through whatever web backend the host has configured, reads the pages it finds, collects
  videos that carry captions, and lists every source, dead end and filtered result in a footer.
  The model never writes HTML; it fills a validated spec and a renderer draws the page. Figures
  are drawn from the course's own outline — layered diagrams, sequence diagrams, small charts —
  and every section ends with an exercise that answers back.
  Disclosure — needs network access: the course is written by the host model through ctx.llm,
  pages are read over the web with the host's own extractor or a configured scraper, and video
  lookups run yt-dlp and youtube-transcript-api. It writes only its own plugin data directory
  plus an optional copy under ~/Courses, and owns no credentials of its own.
maintainer: NehuenD
tier: community
category: tools
requires_hermes: ">=0.23"
docs_url: https://github.com/NehuenD/hermes_coursewright#readme
version: "0.4.5"
platforms: []
capabilities:
  provides_tools:
